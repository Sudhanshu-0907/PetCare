name: CI and CD

on:
  push:
    branches:
      - CI-CD_Integration
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.9.0'

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: npm install

      - name: Run Prettier check
        run: npx prettier --check .

      - name: Send Google Chat notification on failure
        if: failure()
        run: |
          curl -X POST \
              -H "Content-Type: application/json; charset=UTF-8" \
              -d '{
                    "text": "🚨 CI/CD Build Failed!\nCheck logs for Testing, Linting, or Prettier errors."
                  }' \
              ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

      - name: Send Google Chat notification on success
        if: success()
        run: |
          curl -X POST \
              -H "Content-Type: application/json; charset=UTF-8" \
              -d '{
                    "text": "✅ All CI/CD checks passed successfully!"
                  }' \
              ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

